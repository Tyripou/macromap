name: Refresh live news

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests de la logique de fusion
        run: node scripts/test-news-lib.mjs

      - name: Fetch and classify news
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/refresh-news.mjs

      - name: Commit updated news file (if changed)
        run: |
          git config user.name "macromap-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/live-news.json
          if git diff --cached --quiet; then
            echo "Rien à commiter."
            exit 0
          fi
          git commit -m "chore: refresh live news"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Trigger Vercel redeploy (optionnel)
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
